name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP 8.4 (migrations + tests)
    runs-on: ubuntu-latest

    # Production runs MySQL, so migrations are checked there; the PHPUnit suite
    # itself uses SQLite :memory: (phpunit.xml).
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: gcm_book_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, bcmath, gd, pdo_mysql, pdo_sqlite, zip
          coverage: none
          tools: composer:v2

      - name: Assert patched PHP (CVE-2026-109618/109619)
        run: php -r 'echo PHP_VERSION, PHP_EOL; exit((int) version_compare(PHP_VERSION, "8.4.27", "<"));'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          npm ci

      - name: Build assets (typecheck + vite)
        run: npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Migrations on MySQL (up, down, up)
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_DATABASE: gcm_book_ci
          DB_USERNAME: root
          DB_PASSWORD: ''
        run: |
          php artisan migrate --force
          php artisan migrate:refresh --force

      - name: Run tests
        run: php artisan test
